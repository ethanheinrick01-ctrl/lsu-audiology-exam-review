  .option-btn.selected { border-color: #56d4dd; background: #1a1f2e; }
  .option-btn.selected .letter { background: #56d4dd; color: #0d1117; }

<script>
const allQuestions = [
  // ===== SPEECH AUDIOMETRY (1-10) =====
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "The primary reason speech audiometry is included in the basic test battery is that pure tone results alone do not reflect how a patient functions in everyday listening situations.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. Pure tones are single-frequency signals presented in silence — they tell you nothing about speech understanding in real environments. Speech audiometry bridges that gap."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Which of the following is a purpose of speech audiometry?",
    type: "mc",
    options: ["Measure middle ear compliance","Cross-check pure tone thresholds","Determine tympanogram type","Assess outer hair cell function"],
    answer: 1,
    explain: "Speech audiometry cross-checks pure tones via SRT-PTA agreement. Middle ear compliance = tympanometry, tympanogram type = immittance, OHC function = OAEs."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Speech audiometry requires a diagnostic audiometer and appropriate transducers (headphones or speakers).",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. The audiometer controls presentation level, and the transducers deliver the speech signal. This is distinct from immittance (probe) or ABR (electrodes) equipment."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Recorded speech materials are preferred over monitored live voice because:",
    type: "mc",
    options: ["They are louder","They are standardized and consistent across test sessions","They don't require a VU meter","They use spondaic words only"],
    answer: 1,
    explain: "Recorded materials sound exactly the same every time. Live voice varies with each clinician's vocal characteristics, articulation, and rate — making it impossible to truly standardize."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "When using monitored live voice, the clinician calibrates by ensuring the carrier phrase peaks at ___ on the VU meter.",
    type: "mc",
    options: ["-5","0","+5","+10"],
    answer: 1,
    explain: "The carrier phrase ('Say the word ___') must peak at 0 on the VU meter. The test word itself does NOT need to hit 0 — words naturally vary in acoustic energy."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Speech audiometry can contribute to diagnosing cochlear versus retrocochlear (8th nerve) pathology.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. WRS is the key tool here — cochlear loss produces WRS proportional to the degree of loss, while retrocochlear pathology produces disproportionately poor WRS relative to the audiogram."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "A patient who performs well on pure tone testing but struggles understanding speech in noisy environments would benefit most from which additional test?",
    type: "mc",
    options: ["Tympanometry","Acoustic reflexes","Word recognition score (WRS)","ABR"],
    answer: 2,
    explain: "WRS directly measures speech understanding ability. Pure tones can't predict real-world communication difficulty — a patient with decent thresholds can still have terrible word recognition, especially with cochlear or retrocochlear issues."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Speech audiometry results can help determine candidacy for hearing aids or cochlear implants.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. Poor WRS with hearing aids is a major factor in cochlear implant candidacy decisions. If amplification isn't helping the patient understand speech, surgical intervention may be warranted."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "The two categories of speech audiometry tests are:",
    type: "mc",
    options: ["Threshold tests (SRT, SDT) and suprathreshold tests (WRS)","Impedance tests and admittance tests","Behavioral tests and electrophysiological tests","Air conduction tests and bone conduction tests"],
    answer: 0,
    explain: "Threshold tests find the softest level speech can be detected (SDT) or recognized (SRT). Suprathreshold tests (WRS) present speech ABOVE threshold to see how well the patient understands at a comfortable level."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "The test word in the carrier phrase must also peak at 0 on the VU meter during monitored live voice testing.",
    type: "tf", options: ["True","False"], answer: 1,
    explain: "False. Only the carrier phrase peaks at 0. Test words vary naturally in acoustic energy — some are louder, some softer. The carrier phrase is the calibration anchor, not the test word."
  },

  // ===== SRT (11-20) =====
  {
    tag: "srt", tagLabel: "SRT",
    q: "The SRT is the lowest intensity at which a patient can recognize speech ___ of the time.",
    type: "mc", options: ["25%","50%","75%","100%"], answer: 1,
    explain: "SRT = 50% correct, just like pure tone thresholds are defined at 50% of ascending trials. Both use the same psychometric principle."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "Spondaic words are used for SRT because their equal stress pattern produces a steep psychometric function — meaning small changes in intensity cause large changes in recognition.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. Equal stress on both syllables (baseball, hotdog, eardrum) means the word is either recognized or it isn't — there's a sharp cutoff. That precision is what makes SRT a reliable, repeatable measure."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "Before SRT testing begins, the patient is familiarized with the spondee word list at a comfortable level. Any words NOT correctly identified during familiarization are:",
    type: "mc",
    options: ["Presented again at a louder level","Eliminated from the test list","Replaced with monosyllabic words","Used anyway but scored differently"],
    answer: 1,
    explain: "Unrecognized words are dropped. The purpose of familiarization is to ensure the patient knows the vocabulary — you're testing hearing, not vocabulary knowledge."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "SRT and PTA should agree within:",
    type: "mc", options: ["5 dB","10 dB","15 dB","20 dB"], answer: 1,
    explain: "±10 dB is the agreement window. Disagreement beyond 10 dB should trigger investigation: exaggeration, precipitous slope, central issues, or calibration error."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "A patient has a PTA of 40 dB HL and an SRT of 45 dB HL. These results are in good agreement.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. 45 − 40 = 5 dB, well within the 10 dB agreement window."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "A patient has a PTA of 30 dB HL and an SRT of 55 dB HL. This 25 dB disagreement could suggest:",
    type: "mc",
    options: ["Normal variability","Patient may be exaggerating pure tone thresholds","Bilateral hearing loss","Conductive hearing loss"],
    answer: 1,
    explain: "When SRT is significantly WORSE (higher) than PTA, the patient may be exaggerating their hearing loss on pure tones (giving false thresholds). SRT is harder to fake because it's a speech task. Other possibilities include central auditory issues or calibration problems."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "One of the four reasons SRT and PTA may disagree is a precipitously sloping audiogram. This causes disagreement because:",
    type: "mc",
    options: ["Spondees are high-frequency weighted","Spondees are low-frequency weighted, so the patient recognizes them using frequencies where hearing is better","The SRT equipment malfunctions with steep slopes","PTA cannot be calculated for sloping audiograms"],
    answer: 1,
    explain: "Spondaic words contain strong low-frequency energy. In a precipitous slope, low frequencies are near normal while high frequencies are severely impaired. PTA (averaging 500, 1000, 2000 Hz) gets dragged up by the bad high-frequency thresholds, but SRT stays low because the patient hears spondees with their good low frequencies."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "SRT provides a reference level for determining the presentation intensity of WRS.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. You need SRT to calculate the sensation level for WRS. WRS is presented at 25-40 dB above the speech threshold (SRT)."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "When SRT cannot be obtained, the appropriate alternative is:",
    type: "mc",
    options: ["PTA","SDT/SAT","WRS at maximum output","Tympanometry"],
    answer: 1,
    explain: "SDT (Speech Detection Threshold) / SAT (Speech Awareness Threshold) is the fallback. It only requires detection — the patient just needs to indicate they heard something, not repeat the word. Used for severe-profound losses, young children, and patients with speech/language impairments."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "SDT requires approximately ___ dB less intensity than SRT because ___ is easier than ___.",
    type: "mc",
    options: ["10 dB; detection; recognition","5 dB; recognition; detection","20 dB; detection; recognition","10 dB; recognition; detection"],
    answer: 0,
    explain: "SDT is ~10 dB lower. Detection (just knowing sound is present) requires less intensity than recognition (understanding the word). Less cognitive demand = less signal needed."
  },

  // ===== WRS (21-30) =====
  {
    tag: "wrs", tagLabel: "WRS",
    q: "WRS uses monosyllabic, phonemically balanced words. The two standard word lists are:",
    type: "mc",
    options: ["CID W-22 and NU-6","Spondee lists A and B","ABR click stimuli and tone bursts","HINT and QuickSIN"],
    answer: 0,
    explain: "CID W-22 and NU-6 (Northwestern University Auditory Test No. 6) are the standard monosyllabic word lists for WRS. They are phonemically balanced — the distribution of phonemes approximates everyday English."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "WRS is an open-set test. This means the patient:",
    type: "mc",
    options: ["Chooses from a visible list of words","Is familiarized with the words before testing begins","Has no preview of the words — they must recognize them cold","Can request words be repeated"],
    answer: 2,
    explain: "Open-set = no familiarization, no word list preview. The opposite of SRT, where patients ARE familiarized first. WRS tests genuine recognition ability without advance knowledge."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "WRS uses ___ words per ear, each worth ___ percent.",
    type: "mc",
    options: ["50 words; 2%","25 words; 4%","10 words; 10%","25 words; 2%"],
    answer: 1,
    explain: "25 words × 4% each = 100%. Whole word scoring — the entire word must be correct. If a patient gets 20/25: 20 × 4 = 80%."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "WRS is presented at a sensation level of 25-40 dB SL. This means the presentation level is 25-40 dB above the patient's:",
    type: "mc",
    options: ["PTA","SRT (speech threshold)","UCL","MCL"],
    answer: 1,
    explain: "Sensation level is referenced to the patient's speech threshold (SRT). If SRT = 40 dB HL and you present at 35 dB SL, the actual presentation level = 40 + 35 = 75 dB HL."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient has an SRT of 35 dB HL. WRS is presented at 70 dB HL. The sensation level is:",
    type: "calc",
    options: ["25 dB SL","30 dB SL","35 dB SL","40 dB SL"],
    answer: 2,
    explain: "Sensation Level = Presentation Level − Threshold. 70 − 35 = 35 dB SL. This falls within the standard 25-40 dB SL presentation range."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient gets 20 out of 25 words correct on WRS. Their score is:",
    type: "calc",
    options: ["75%","78%","80%","84%"],
    answer: 2,
    explain: "20 × 4 = 80%. This falls in the 75-90% range = slight difficulty, described as 'like listening over a telephone.' Professor emphasized you MUST know these categories."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A WRS of 94% is categorized as:",
    type: "mc",
    options: ["Within normal limits (90-100%)","Slight difficulty (75-90%)","Moderate difficulty (60-75%)","Poor recognition (50-60%)"],
    answer: 0,
    explain: "90-100% = Within Normal Limits. The full scale: 90-100% WNL, 75-90% slight difficulty, 60-75% moderate difficulty, 50-60% poor, <50% very poor."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A WRS of 68% places the patient in which category?",
    type: "mc",
    options: ["Slight difficulty","Moderate difficulty","Poor recognition","Very poor recognition"],
    answer: 1,
    explain: "60-75% = moderate difficulty with speech understanding. One step below slight (75-90%) and one step above poor (50-60%)."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient with a purely conductive hearing loss is expected to have excellent WRS (90-100%) when sound is presented at an adequate sensation level, because:",
    type: "mc",
    options: ["The conductive system amplifies speech","The inner ear (cochlea) is intact — it's purely a volume problem","Conductive loss only affects high frequencies","WRS doesn't test conductive function"],
    answer: 1,
    explain: "Conductive loss = volume reduction only. The cochlea is perfectly healthy. If you present sound loud enough to overcome the conductive barrier, the patient hears and understands clearly. Professor's words: 'The inner ear is fine — it's just a loss of volume.'"
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient scores 44% on WRS. This falls in which category and what does it suggest clinically?",
    type: "mc",
    options: ["Poor — marked difficulty following conversation","Very poor — may be unable to follow running speech","Moderate difficulty — still functional with effort","Slight difficulty — like a bad phone connection"],
    answer: 1,
    explain: "Below 50% = very poor. The patient may be unable to follow running speech. This is the worst category and raises serious questions about communication ability and amplification candidacy."
  },

  // ===== MCL / UCL / DYNAMIC RANGE (31-36) =====
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "MCL (most comfortable loudness level) for normal hearing listeners is approximately:",
    type: "mc",
    options: ["20-30 dB HL","40-55 dB HL","70-85 dB HL","90-100 dB HL"],
    answer: 1,
    explain: "40-55 dB HL is the comfort zone for speech. This is where normal-hearing people prefer to listen."
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "UCL (uncomfortable loudness level) for speech is approximately ___ dB HL for both normal-hearing individuals AND those with cochlear hearing loss.",
    type: "mc",
    options: ["70","85","100","120"],
    answer: 2,
    explain: "UCL ≈ 100 dB HL. Critical point: cochlear loss patients have the SAME UCL as normal-hearing individuals. Their threshold goes up, their UCL stays put — that's what squeezes the dynamic range."
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "Dynamic range is calculated as UCL minus SRT.",
    type: "tf", options: ["True","False"], answer: 0,
    explain: "True. Dynamic range = UCL − SRT. It represents the usable listening range between the softest speech you can understand and the loudest speech you can tolerate."
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "A normal-hearing patient has an SRT of 5 dB HL and UCL of 100 dB HL. Their dynamic range is:",
    type: "calc",
    options: ["85 dB","90 dB","95 dB","100 dB"],
    answer: 2,
    explain: "100 − 5 = 95 dB. This is a large, healthy dynamic range — plenty of room between the softest audible speech and discomfort."
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "A patient with cochlear loss has an SRT of 50 dB HL and UCL of 100 dB HL. Their dynamic range is ___ dB, which is ___ compared to normal.",
    type: "calc",
    options: ["50 dB; reduced","50 dB; normal","100 dB; normal","150 dB; expanded"],
    answer: 0,
    explain: "100 − 50 = 50 dB. Normal is ~95-100 dB. This patient's range is cut roughly in half. The floor (SRT) went up, but the ceiling (UCL) stayed the same. This is why cochlear loss patients say 'speak up!' then immediately 'stop yelling!'"
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "A patient with cochlear hearing loss has a reduced dynamic range because their UCL drops significantly below 100 dB HL.",
    type: "tf", options: ["True","False"], answer: 1,
    explain: "False. UCL stays around 100 dB HL. The dynamic range shrinks because the SRT is elevated (floor goes up), NOT because UCL drops (ceiling stays the same). This concept is called recruitment."
  },

  // ===== IMMITTANCE (37-42) =====
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "Immittance testing is a direct test of hearing ability.",
    type: "tf", options: ["True","False"], answer: 1,
    explain: "False. Immittance measures mechanical properties of the middle ear — NOT hearing. A patient can have perfectly normal immittance and a severe sensorineural hearing loss."
  },
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "The term 'immittance' combines which two concepts?",
    type: "mc",
    options: ["Impedance and admittance","Impedance and compliance","Admittance and conductance","Immersion and impedance"],
    answer: 0,
    explain: "Immittance = impedance + admittance. Impedance (Ohms) = resistance to energy flow. Admittance (mmhos) = ease of energy flow. They are reciprocals of each other."
  },
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "The standard probe tone for adult tympanometry is:",
    type: "mc",
    options: ["226 Hz at 85 dB SPL","1000 Hz at 85 dB SPL","226 Hz at 65 dB SPL","500 Hz at 90 dB SPL"],

// Fisher-Yates shuffle
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const questions = shuffle(allQuestions);
const TOTAL = questions.length;

const container = document.getElementById('questionsContainer');
let answered = 0, correct = 0, wrong = 0;
const userAnswers = new Array(TOTAL).fill(-1);

const tagClasses = {
  speech: 'tag-speech', srt: 'tag-srt', wrs: 'tag-wrs', mcl: 'tag-mcl',
  immittance: 'tag-immittance', tymp: 'tag-tymp', reflex: 'tag-reflex',
  oae: 'tag-oae', abr: 'tag-abr', comp: 'tag-comp'
};

questions.forEach((q, i) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `q${i}`;

  const typeBadge = q.type === 'tf' ? '<span class="q-type-badge badge-tf">T/F</span>' :
                    q.type === 'calc' ? '<span class="q-type-badge badge-calc">CALC</span>' :
                    '<span class="q-type-badge badge-mc">MC</span>';

  const topicTag = `<span class="topic-tag ${tagClasses[q.tag] || ''}">${q.tagLabel}</span>`;

  let optionsHTML = q.options.map((opt, j) => {
    const letter = q.type === 'tf' ? (j === 0 ? 'T' : 'F') : String.fromCharCode(65 + j);
    return `<button class="option-btn" data-q="${i}" data-opt="${j}" onclick="selectAnswer(${i}, ${j})">
      <span class="letter">${letter}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  card.innerHTML = `
    <span class="q-number">Q${i + 1} ${typeBadge} ${topicTag}</span>
    <div class="q-text">${q.q}</div>
    <div class="options">${optionsHTML}</div>
    <div class="explanation" id="exp${i}">${q.explain}</div>
  `;
  container.appendChild(card);
});

function selectAnswer(qi, oi) {
  const card = document.getElementById(`q${qi}`);
  const btns = card.querySelectorAll('.option-btn');
  const exp = document.getElementById(`exp${qi}`);
  if (btns[0].classList.contains('locked')) return;
  const wasUnanswered = userAnswers[qi] === -1;
  userAnswers[qi] = oi;
  btns.forEach(b => { b.classList.remove('selected','correct-answer','wrong-answer'); b.classList.add('locked'); });
  const isCorrect = oi === questions[qi].answer;
  if (isCorrect) {
    btns[oi].classList.add('correct-answer');
    card.classList.add('answered-correct');
    exp.className = 'explanation show correct-exp';
    if (wasUnanswered) correct++;
  } else {
    btns[oi].classList.add('wrong-answer');
    btns[questions[qi].answer].classList.add('correct-answer');
    card.classList.add('answered-wrong');
    exp.className = 'explanation show wrong-exp';
    if (wasUnanswered) wrong++;
  }
  if (wasUnanswered) answered++;
  updateScore();
}

function updateScore() {
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('correctCount').textContent = correct + ' ✓';
  document.getElementById('wrongCount').textContent = wrong + ' ✗';
  document.getElementById('unansweredCount').textContent = (TOTAL - answered) + ' left';
}

function submitExam() {
  const missedQs = [];
  questions.forEach((q, i) => {
    if (userAnswers[i] === -1) {
      const card = document.getElementById(`q${i}`);
      const btns = card.querySelectorAll('.option-btn');
      const exp = document.getElementById(`exp${i}`);
      btns.forEach(b => b.classList.add('locked'));
      btns[q.answer].classList.add('correct-answer');
      exp.className = 'explanation show wrong-exp';
      exp.innerHTML = '⚠️ UNANSWERED — ' + q.explain;
      card.classList.add('answered-wrong');
      wrong++; answered++;
      missedQs.push({ num: i + 1, topic: q.tagLabel, text: q.q.substring(0, 80) + '...' });
    } else if (userAnswers[i] !== q.answer) {
      missedQs.push({ num: i + 1, topic: q.tagLabel, text: q.q.substring(0, 80) + '...' });
    }
  });
  updateScore();

  const pct = Math.round((correct / TOTAL) * 100);
  const grade = pct >= 93 ? 'A' : pct >= 90 ? 'A-' : pct >= 87 ? 'B+' : pct >= 83 ? 'B' : pct >= 80 ? 'B-' : pct >= 77 ? 'C+' : pct >= 73 ? 'C' : 'Below C';
  const panel = document.getElementById('resultsPanel');
  panel.style.display = 'block';
  document.getElementById('finalScore').textContent = `${correct}/${TOTAL} — ${pct}%`;
  document.getElementById('finalScore').style.color = pct >= 90 ? '#3fb950' : pct >= 80 ? '#58a6ff' : pct >= 70 ? '#d29922' : '#f85149';
  document.getElementById('breakdown').innerHTML = `
    Grade: <strong>${grade}</strong><br>
    Correct: ${correct} | Wrong: ${wrong}<br><br>
    ${pct >= 90 ? "Solid. You know this material." : pct >= 80 ? "Almost there — review the missed list below and run it again." : pct >= 70 ? "Decent but gaps remain. Hit the weak topics." : "Need more work. Focus on the topics you're missing most."}
  `;

  const missedDiv = document.getElementById('missedList');
  if (missedQs.length > 0) {
    missedDiv.innerHTML = `<h3>MISSED QUESTIONS (${missedQs.length})</h3>` +
      missedQs.map(m => `<div class="missed-item"><strong>Q${m.num}</strong> [${m.topic}] — ${m.text}</div>`).join('');
  } else {
    missedDiv.innerHTML = '<h3 style="color:#3fb950">PERFECT SCORE — ZERO MISSED</h3>';
  }
  panel.scrollIntoView({ behavior: 'smooth' });
}
</script>

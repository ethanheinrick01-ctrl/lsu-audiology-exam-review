<style>

<body>
<div class="container">
  <div class="header">

    <div class="missed-list" id="missedList"></div>
    <button class="reset-btn" onclick="resetExam()">Retake Exam</button>

<script>
const allQuestions = [
  // ===== SPEECH AUDIOMETRY =====
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "A patient performs well in a quiet booth but struggles in background noise. Pure tone audiometry alone would have predicted this difficulty.",
    type: "tf", options: ["True","False"], answer: 1,
    explain: "Pure tones are presented in silence and don't represent real-world listening. Speech audiometry — especially WRS — can reveal deficits that pure tones miss. That's the whole reason speech testing exists."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Speech audiometry can be used to differentiate between cochlear and retrocochlear pathology. Which specific measure is most useful for this purpose?",
    type: "mc", options: ["SRT","SDT/SAT","WRS (word recognition score)","MCL"], answer: 2,
    explain: "WRS is the key differentiator. Cochlear loss = WRS proportional to degree of loss. Retrocochlear = WRS disproportionately poor relative to the audiogram (rollover effect). SRT just gives you a threshold."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "The carrier phrase 'Say the word ___' during live voice testing should peak at 0 on the VU meter. The test word itself must also peak at exactly 0.",
    type: "tf", options: ["True","False"], answer: 1,
    explain: "The carrier phrase peaks at 0 on the VU meter, but the test word does NOT have to peak at 0. Words vary naturally in acoustic energy. The carrier phrase is what calibrates the presentation level."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Two clinicians test the same patient on the same day using monitored live voice. Their SRT results differ by 15 dB. This discrepancy is unexpected.",
    type: "tf", options: ["True","False"], answer: 1,
    explain: "Actually, live voice is NOT standardized — each clinician's voice has different spectral characteristics, speaking rate, and articulatory precision. A 15 dB difference is not ideal but illustrates exactly why recorded materials are preferred. The discrepancy is clinically concerning but not 'unexpected' given the inherent variability of MLV. The FALSE here is because this kind of variability is a known limitation."
  },
  {
    tag: "speech", tagLabel: "SPEECH",
    q: "Which of the following is a valid reason for performing speech audiometry?",
    type: "mc",
    options: ["To replace immittance testing when equipment is unavailable","To cross-check pure tone results and assess real-world communication ability","To determine the type of tympanogram","To measure ear canal volume"],
    answer: 1,
    explain: "Speech audiometry cross-checks pure tones (via SRT-PTA agreement) and assesses functional communication (via WRS). It has nothing to do with immittance, tympanograms, or ear canal volume."
  },

  // ===== SRT =====
  {
    tag: "srt", tagLabel: "SRT",
    q: "A patient's PTA is 30 dB HL. Which of the following SRT values would indicate POOR agreement?",
    type: "mc", options: ["25 dB HL","35 dB HL","38 dB HL","50 dB HL"], answer: 3,
    explain: "SRT-PTA agreement must be within ±10 dB. 50 − 30 = 20 dB difference — way outside the window. 25, 35, and 38 are all within 10 dB of 30."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "During SRT testing, a patient cannot repeat back spondaic words at any level. The clinician should:",
    type: "mc",
    options: ["Increase intensity to maximum output and repeat","Switch to SDT/SAT","Proceed directly to WRS","Cancel the appointment"],
    answer: 1,
    explain: "SDT/SAT is the fallback when SRT cannot be obtained — for severe-profound losses, young children, speech/language impairments, or cognitive deficits. SDT only requires detection (awareness of sound), not recognition."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "Spondaic words are used for SRT because they:",
    type: "mc",
    options: ["Have variable stress patterns that test discrimination","Are two-syllable words with equal stress, giving a steep psychometric function","Are monosyllabic and phonemically balanced","Are nonsense syllables that prevent guessing"],
    answer: 1,
    explain: "Spondees = two syllables, equal stress (baseball, hotdog, eardrum). The equal stress gives them a steep psychometric function — small changes in intensity produce large changes in recognition. That precision is what makes SRT reliable."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "The SRT is defined at the intensity where speech is recognized correctly on what percentage of presentations?",
    type: "mc", options: ["25%","50%","75%","100%"], answer: 1,
    explain: "SRT = 50%, same principle as pure tone threshold. Both are defined at the 50% correct response level."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "A patient has a precipitously sloping audiogram (normal thresholds at 250-500 Hz, severe loss at 2000-4000 Hz). Their PTA is 45 dB HL but their SRT is 20 dB HL. This disagreement is most likely because:",
    type: "mc",
    options: ["The patient is exaggerating","The VU meter is miscalibrated","The patient can use low-frequency speech cues to recognize spondees despite the high-frequency loss","The SRT test was administered incorrectly"],
    answer: 2,
    explain: "Precipitous slopes cause SRT-PTA disagreement because spondees are low-frequency-weighted words. The patient recognizes them using the frequencies where they still hear well. PTA averages across 500, 1000, 2000 Hz and gets dragged up by the high-frequency loss. This is one of the four classic reasons for SRT-PTA disagreement."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "SDT is typically obtained at a level approximately ___ dB below the SRT because detection requires ___ intensity than recognition.",
    type: "mc",
    options: ["10 dB; less","10 dB; more","20 dB; less","5 dB; less"],
    answer: 0,
    explain: "SDT is ~10 dB lower than SRT. You only need to detect that sound exists (awareness), not understand the word. Detection = easier = less intensity needed."
  },
  {
    tag: "srt", tagLabel: "SRT",
    q: "If SRT and PTA disagree by more than 10 dB with SRT being significantly BETTER (lower) than PTA, which of the following is the LEAST likely explanation?",
    type: "mc",
    options: ["Precipitous audiometric slope","Patient exaggeration of pure tone thresholds","Central auditory processing disorder","Equipment malfunction in the speech channel"],
    answer: 2,
    explain: "When SRT is better than PTA, the most common reasons are precipitous slope (spondees are low-freq weighted) or exaggeration of pure tone thresholds. CAPD typically causes the opposite pattern — poorer speech understanding than expected. Equipment malfunction is always possible but is a calibration issue."
  },

  // ===== WRS =====
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient scores 18 out of 25 words correct on WRS. What is the percentage and interpretation?",
    type: "calc",
    options: ["68% — moderate difficulty","72% — moderate difficulty","76% — slight difficulty","80% — slight difficulty"],
    answer: 1,
    explain: "18 × 4 = 72%. The WRS scale: 90-100% = WNL, 75-90% = slight difficulty, 60-75% = moderate difficulty, 50-60% = poor, <50% = very poor. 72% falls in the 60-75% moderate difficulty range."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient has an SRT of 50 dB HL. You present WRS at 85 dB HL. The sensation level is:",
    type: "calc",
    options: ["25 dB SL","30 dB SL","35 dB SL","50 dB SL"],
    answer: 2,
    explain: "Sensation Level = Presentation Level − Threshold. 85 − 50 = 35 dB SL. This falls within the standard 25-40 dB SL range. Professor-confirmed test question format."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "WRS uses an open-set format. This means the patient:",
    type: "mc",
    options: ["Hears the word list beforehand and selects from it","Is NOT familiarized with the words before testing","Chooses their preferred presentation level","Can see the word list during testing"],
    answer: 1,
    explain: "Open-set = no preview of the words. This is the opposite of SRT, where the patient IS familiarized with the spondee list before testing. WRS tests genuine recognition ability."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient with a purely conductive hearing loss and an SRT of 45 dB HL receives WRS at 80 dB HL. You would expect their WRS to be:",
    type: "mc",
    options: ["Very poor (<50%) because of the hearing loss","Poor (50-60%) due to reduced audibility","Excellent (90-100%) because the inner ear is intact","Moderate difficulty (60-75%) from distortion"],
    answer: 2,
    explain: "Conductive loss = the inner ear (cochlea) is perfectly fine. It's just a volume problem. If you crank the sound loud enough to overcome the conductive barrier, the patient hears it clearly. Professor specifically said she sees excellent WRS with conductive losses all the time because 'the inner ear is fine, it's just a loss of volume.'"
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "Each word on the 25-word WRS list is worth ___ percent.",
    type: "mc", options: ["2%","4%","5%","10%"], answer: 1,
    explain: "25 words × 4% each = 100%. If you miss 3 words: 22 × 4 = 88%."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient scores 60% on WRS. This indicates:",
    type: "mc",
    options: ["Within normal limits","Slight difficulty — like listening over a telephone","Moderate difficulty with speech understanding","Poor recognition — marked difficulty following conversation"],
    answer: 2,
    explain: "60% sits right at the boundary of moderate difficulty (60-75%). The scale: 90-100% = WNL, 75-90% = slight, 60-75% = moderate, 50-60% = poor, <50% = very poor."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "WRS presentation level is measured in dB SL (sensation level) rather than dB HL. The standard presentation range is:",
    type: "mc", options: ["10-20 dB SL","25-40 dB SL","50-70 dB SL","80-100 dB SL"], answer: 1,
    explain: "WRS is presented at 25-40 dB SL (above the patient's speech threshold). This ensures the words are comfortably audible. Professor confirmed this is a test question."
  },
  {
    tag: "wrs", tagLabel: "WRS",
    q: "A patient gets 23 out of 25 words correct on WRS. Their score and category are:",
    type: "calc",
    options: ["88% — slight difficulty","92% — WNL","96% — WNL","84% — slight difficulty"],
    answer: 1,
    explain: "23 × 4 = 92%. 90-100% = Within Normal Limits. Just barely into WNL territory."
  },

  // ===== MCL / UCL / DYNAMIC RANGE =====
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "A patient with a cochlear hearing loss has an SRT of 60 dB HL and a UCL of 95 dB HL. Their dynamic range is ___ dB, which is ___ compared to normal.",
    type: "calc",
    options: ["35 dB; reduced","55 dB; reduced","35 dB; normal","60 dB; normal"],
    answer: 0,
    explain: "Dynamic Range = UCL − SRT = 95 − 60 = 35 dB. Normal dynamic range is ~100 dB (UCL ~100 minus SRT ~0). 35 dB is severely compressed — this is recruitment. The ceiling stays the same but the floor is way up."
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "The reason cochlear hearing loss patients have a reduced dynamic range is primarily because their:",
    type: "mc",
    options: ["UCL drops significantly below 100 dB HL","SRT is elevated while UCL remains approximately the same (~100 dB HL)","MCL shifts upward to match their UCL","Both SRT and UCL increase proportionally"],
    answer: 1,
    explain: "This is recruitment. The cochlear damage raises the SRT (floor goes up) but the UCL stays around 100 dB HL (ceiling doesn't move). The usable listening range gets squeezed from below. That's why these patients say 'speak up!' then immediately 'stop yelling!'"
  },
  {
    tag: "mcl", tagLabel: "MCL/UCL",
    q: "MCL for normal hearing is approximately 40-55 dB HL. This measure is clinically useful primarily for:",
    type: "mc",
    options: ["Diagnosing type of hearing loss","Setting hearing aid gain targets","Calculating PTA","Determining tympanogram type"],
    answer: 1,
    explain: "MCL tells you where the patient prefers to listen — critical for programming hearing aids. You want amplified speech to land near the patient's MCL, not at their UCL."
  },

  // ===== IMMITTANCE =====
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "A patient has perfectly normal tympanometry results but a moderate sensorineural hearing loss. This is:",
    type: "mc",
    options: ["Impossible — normal immittance means normal hearing","Expected — immittance measures middle ear mechanics, not hearing","A sign the tympanometer is malfunctioning","Evidence the hearing loss is exaggerated"],
    answer: 1,
    explain: "Immittance is NOT a hearing test. It measures middle ear mechanical properties. A patient with SNHL has a perfectly normal middle ear — the damage is in the cochlea. Normal tymp + SNHL is an extremely common clinical finding."
  },
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "Impedance and admittance are ___ of each other. Impedance is measured in ___ and admittance in ___.",
    type: "mc",
    options: ["Reciprocals; Ohms; mmhos","Synonyms; Ohms; Ohms","Reciprocals; mmhos; Ohms","Equivalents; daPa; mL"],
    answer: 0,
    explain: "Impedance (resistance to flow, Ohms) and admittance (ease of flow, mmhos) are reciprocals. High impedance = low admittance and vice versa. 'Immittance' combines both terms."
  },
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "The hermetic seal created by the probe tip in the ear canal is necessary because:",
    type: "mc",
    options: ["It prevents the patient from hearing the probe tone","Without a seal, ear canal pressure cannot be systematically varied","It amplifies the probe tone to make the test more accurate","It reduces patient discomfort during testing"],
    answer: 1,
    explain: "The probe must create an airtight seal so the instrument can control air pressure in the ear canal (from +200 to -400 daPa). Without the seal, you can't change pressure and tympanometry is impossible."
  },
  {
    tag: "immittance", tagLabel: "IMMITTANCE",
    q: "Immittance testing can assess facial nerve (CN VII) integrity because:",
    type: "mc",
    options: ["CN VII innervates the outer hair cells","CN VII innervates the stapedius muscle, which mediates the acoustic reflex","CN VII controls the tensor tympani","CN VII transmits sound information to the brainstem"],
    answer: 1,
    explain: "CN VII (facial nerve) innervates the stapedius muscle. If CN VII is damaged (e.g., Bell's palsy), the acoustic reflex will be absent on the affected side even though hearing is normal. That's a direct neural test via immittance."
  },

  // ===== TYMPANOMETRY =====
  {
    tag: "tymp", tagLabel: "TYMP",
    q: "An adult patient's tympanogram shows: ECV = 1.2 mL, compliance = 0.4 mL, peak pressure = -30 daPa, width = 95 daPa. This is a Type:",
    type: "mc", options: ["A","As","Ad","C"], answer: 0,
    explain: "All four variables are within normal adult limits. ECV: 0.9-2.0 ✓, Compliance: 0.3-1.7 ✓, Pressure: within ±150 ✓, Width: <125 ✓. Type A = all four normal."
  },
  {
    tag: "tymp", tagLabel: "TYMP",
    q: "An adult's tympanogram shows: ECV = 1.5 mL, compliance = 0.2 mL, peak pressure = +10 daPa, width = 100 daPa. This is a Type:",
    type: "mc", options: ["A","As","Ad","B"], answer: 1,
    explain: "Compliance of 0.2 is BELOW the normal range (0.3-1.7 mL). Everything else is normal. Low compliance = stiff = Type As. Think otosclerosis — the stapes is fixated and the ossicular chain doesn't move freely."
  },
  {
    tag: "tymp", tagLabel: "TYMP",
    q: "An adult's tympanogram shows: ECV = 1.0 mL, compliance = 3.8 mL, peak pressure = -20 daPa, width = 80 daPa. This is a Type:",
    type: "mc", options: ["A","As","Ad","C"], answer: 2,
    explain: "Compliance of 3.8 is WAY above normal (0.3-1.7 mL). Everything else is normal. Excessive compliance = deep peak = Type Ad. Think ossicular chain discontinuity or very flaccid TM — the chain moves too freely because something is disconnected."
  },
  {
    tag: "tymp", tagLabel: "TYMP",
    q: "A child's tympanogram shows: ECV = 0.6 mL, flat tracing (no identifiable peak), width not measurable. This is a Type B. Given the ECV, the most likely cause is:",
    type: "mc",
    options: ["TM perforation","Patent PE tube","Middle ear pathology (e.g., fluid/effusion)","Cerumen occlusion"],
    answer: 2,
    explain: "Type B + NORMAL ECV for a child (0.3-0.9 mL). ECV of 0.6 is normal, so the TM is intact (no perforation) and the probe isn't blocked (not too small). The flat tracing is caused by something in the middle ear space — fluid, mass, etc. This is the classic otitis media with effusion pattern."
  },
  {
    tag: "tymp", tagLabel: "TYMP",
    q: "A child has PE tubes bilaterally. The left ear shows Type B with ECV of 3.5 mL. The right ear shows Type B with ECV of 0.4 mL. What is happening in each ear?",
    type: "mc",
    options: [
      "Left: tube is patent; Right: tube is blocked/occluded",
      "Left: tube is blocked; Right: tube is patent",
      "Both tubes are patent",
      "Both tubes are blocked"
    ],
    answer: 0,
    explain: "Left: Type B + huge volume (3.5 mL, way above child norms) = the probe is seeing through the tube into the middle ear space = tube is patent and working. Right: Type B + normal-small volume (0.4 mL) with a tube that SHOULD show large volume = tube is blocked/occluded. This is exactly the pattern your professor walked through in class — the blocked tube kid."
  },
  {
    tag: "tymp", tagLabel: "TYMP",

// Shuffle using Fisher-Yates
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const questions = shuffle(allQuestions);
const TOTAL = questions.length;

const container = document.getElementById('questionsContainer');
let answered = 0, correct = 0, wrong = 0;
const userAnswers = new Array(TOTAL).fill(-1);

const tagClasses = {
  speech: 'tag-speech', srt: 'tag-srt', wrs: 'tag-wrs', mcl: 'tag-mcl',
  immittance: 'tag-immittance', tymp: 'tag-tymp', reflex: 'tag-reflex',
  oae: 'tag-oae', abr: 'tag-abr', comp: 'tag-comp'
};

questions.forEach((q, i) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `q${i}`;

  const typeBadge = q.type === 'tf' ? '<span class="q-type-badge badge-tf">T/F</span>' :
                    q.type === 'calc' ? '<span class="q-type-badge badge-calc">CALC</span>' :
                    '<span class="q-type-badge badge-mc">MC</span>';

  const topicTag = `<span class="topic-tag ${tagClasses[q.tag] || ''}">${q.tagLabel}</span>`;

  let optionsHTML = q.options.map((opt, j) => {
    const letter = q.type === 'tf' ? (j === 0 ? 'T' : 'F') : String.fromCharCode(65 + j);
    return `<button class="option-btn" data-q="${i}" data-opt="${j}" onclick="selectAnswer(${i}, ${j})">
      <span class="letter">${letter}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  card.innerHTML = `
    <span class="q-number">Q${i + 1} ${typeBadge} ${topicTag}</span>
    <div class="q-text">${q.q}</div>
    <div class="options">${optionsHTML}</div>
    <div class="explanation" id="exp${i}">${q.explain}</div>
  `;
  container.appendChild(card);
});

function selectAnswer(qi, oi) {
  const card = document.getElementById(`q${qi}`);
  const btns = card.querySelectorAll('.option-btn');
  const exp = document.getElementById(`exp${qi}`);
  if (btns[0].classList.contains('locked')) return;
  const wasUnanswered = userAnswers[qi] === -1;
  userAnswers[qi] = oi;
  btns.forEach(b => { b.classList.remove('selected','correct-answer','wrong-answer'); b.classList.add('locked'); });
  const isCorrect = oi === questions[qi].answer;
  if (isCorrect) {
    btns[oi].classList.add('correct-answer');
    card.classList.add('answered-correct');
    exp.className = 'explanation show correct-exp';
    if (wasUnanswered) correct++;
  } else {
    btns[oi].classList.add('wrong-answer');
    btns[questions[qi].answer].classList.add('correct-answer');
    card.classList.add('answered-wrong');
    exp.className = 'explanation show wrong-exp';
    if (wasUnanswered) wrong++;
  }
  if (wasUnanswered) answered++;
  updateScore();
}

function updateScore() {
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('correctCount').textContent = correct + ' ✓';
  document.getElementById('wrongCount').textContent = wrong + ' ✗';
  document.getElementById('unansweredCount').textContent = (TOTAL - answered) + ' left';
}

function submitExam() {
  const missedQs = [];
  questions.forEach((q, i) => {
    if (userAnswers[i] === -1) {
      const card = document.getElementById(`q${i}`);
      const btns = card.querySelectorAll('.option-btn');
      const exp = document.getElementById(`exp${i}`);
      btns.forEach(b => b.classList.add('locked'));
      btns[q.answer].classList.add('correct-answer');
      exp.className = 'explanation show wrong-exp';
      exp.innerHTML = '⚠️ UNANSWERED — ' + q.explain;
      card.classList.add('answered-wrong');
      wrong++; answered++;
      missedQs.push({ num: i + 1, topic: q.tagLabel, text: q.q.substring(0, 80) + '...' });
    } else if (userAnswers[i] !== q.answer) {
      missedQs.push({ num: i + 1, topic: q.tagLabel, text: q.q.substring(0, 80) + '...' });
    }
  });
  updateScore();

  const pct = Math.round((correct / TOTAL) * 100);
  const grade = pct >= 93 ? 'A' : pct >= 90 ? 'A-' : pct >= 87 ? 'B+' : pct >= 83 ? 'B' : pct >= 80 ? 'B-' : pct >= 77 ? 'C+' : pct >= 73 ? 'C' : 'Below C';
  const panel = document.getElementById('resultsPanel');
  panel.style.display = 'block';
  document.getElementById('finalScore').textContent = `${correct}/${TOTAL} — ${pct}%`;
  document.getElementById('finalScore').style.color = pct >= 90 ? '#3fb950' : pct >= 80 ? '#58a6ff' : pct >= 70 ? '#d29922' : '#f85149';
  document.getElementById('breakdown').innerHTML = `
    Grade: <strong>${grade}</strong><br>
    Correct: ${correct} | Wrong: ${wrong}<br><br>
    ${pct >= 90 ? "Clean run. You're exam-ready." : pct >= 80 ? "Close — review the missed list below and run it again." : pct >= 70 ? "Decent but not safe. Hit the weak spots." : "You need more passes. Focus on the red cards above."}
  `;

  const missedDiv = document.getElementById('missedList');
  if (missedQs.length > 0) {
    missedDiv.innerHTML = `<h3>MISSED QUESTIONS (${missedQs.length})</h3>` +
      missedQs.map(m => `<div class="missed-item"><strong>Q${m.num}</strong> [${m.topic}] — ${m.text}</div>`).join('');
  } else {
    missedDiv.innerHTML = '<h3 style="color:#3fb950">PERFECT SCORE — ZERO MISSED</h3>';
  }
  panel.scrollIntoView({ behavior: 'smooth' });
}

function resetExam() {
  answered = 0; correct = 0; wrong = 0;
  userAnswers.fill(-1);
  // Re-shuffle
  const newOrder = shuffle([...Array(TOTAL).keys()]);
  const cards = document.querySelectorAll('.question-card');
  // Just reset visual state, keep same order (reshuffled on page reload)
  questions.forEach((q, i) => {
    const card = document.getElementById(`q${i}`);
    card.className = 'question-card';
    card.querySelectorAll('.option-btn').forEach(b => { b.className = 'option-btn'; });
    document.getElementById(`exp${i}`).className = 'explanation';
  });
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('missedList').innerHTML = '';
  updateScore();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
